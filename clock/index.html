<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clock | Steve Tutor</title>
  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #000;
      color: #fff;
    }

    body {
      display: grid;
      place-items: center;
      min-height: 100vh;
      min-height: 100dvh;
    }

    #clock {
      font-family: ui-monospace, "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      font-size: min(19vw, 65vh);
      font-size: min(19vw, 65dvh);
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      line-height: 1;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <time id="clock" aria-label="Current local time">00:00:00</time>
  <noscript>Enable JavaScript to display the current time.</noscript>
  <script>
    const clock = document.getElementById('clock');

    function updateClock() {
      const now = new Date();
      const time = [now.getHours(), now.getMinutes(), now.getSeconds()]
        .map(value => String(value).padStart(2, '0'))
        .join(':');

      clock.textContent = time;
      clock.dateTime = time;
      // Read the device clock on every tick so the display never accumulates drift.
      setTimeout(updateClock, 1000 - (Date.now() % 1000));
    }

    updateClock();
  </script>
</body>
</html>
