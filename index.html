<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0c0c0c" />
    <meta
      name="description"
      content="One-on-one math tutoring with Steve in Semiahmoo. Book a session."
    />
    <title>Steve Tutoring — Make math click.</title>
    <link
      rel="icon"
      href="https://i.postimg.cc/N0rZb872/image.png"
      type="image/png"
    />
    <style>
      :root {
        color-scheme: dark;
        --background: #0c0c0c;
        --text: #eeeeee;
        --muted: #929292;
      }
      * {
        box-sizing: border-box;
      }
      html {
        scroll-behavior: smooth;
      }
      body {
        margin: 0;
        background: var(--background);
        color: var(--text);
        font-family:
          "SF Pro Text",
          "SF Pro",
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        font-weight: 400;
        -webkit-font-smoothing: antialiased;
      }
      body::before {
        content: "";
        position: absolute;
        inset: 0 0 auto;
        height: 110svh;
        pointer-events: none;
        background: radial-gradient(
          ellipse at 50% 35%,
          rgba(255, 255, 255, 0.045),
          transparent 65%
        );
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      a:focus-visible {
        outline: 2px solid #bcbcbc;
        outline-offset: 5px;
      }
      ::selection {
        background: #dddddd;
        color: #111111;
      }
      .skip {
        position: fixed;
        left: 20px;
        top: -100px;
        z-index: 50;
        padding: 12px;
        background: white;
        color: black;
        border-radius: 12px;
      }
      .skip:focus {
        top: 20px;
      }
      .header {
        position: fixed;
        inset: 0 0 auto;
        z-index: 20;
        padding: 25px 24px;
        transition: padding 0.5s cubic-bezier(0.22, 1, 0.36, 1);
      }
      .nav {
        width: min(1120px, 100%);
        margin: auto;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px 22px;
        border: 1px solid transparent;
        border-radius: 18px;
        transition:
          background 0.5s,
          border-color 0.5s,
          box-shadow 0.5s;
      }
      .brand {
        font-family:
          "SF Pro Display",
          "SF Pro",
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        font-size: 19px;
        font-weight: 600;
        letter-spacing: -0.6px;
      }
      .brand span {
        color: #999999;
        font-weight: 400;
      }
      .header.scrolled {
        padding-top: 12px;
        padding-bottom: 12px;
      }
      .header.scrolled .nav {
        background: rgba(28, 28, 28, 0.68);
        border-color: rgba(255, 255, 255, 0.085);
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
        box-shadow: 0 10px 40px #00000020;
      }
      .nav-book {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        height: 36px;
        padding: 0 17px;
        border-radius: 24px;
        background: #e4e4e4;
        color: #171717;
        font-size: 12px;
        font-weight: 500;
        opacity: 0;
        transform: translateY(8px);
        pointer-events: none;
        transition:
          opacity 0.35s,
          transform 0.5s cubic-bezier(0.22, 1, 0.36, 1);
      }
      .header.scrolled .nav-book {
        opacity: 1;
        transform: translateY(0);
        pointer-events: auto;
      }
      main {
        position: relative;
      }
      .hero {
        min-height: 100svh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 140px 24px 120px;
      }
      h1 {
        font-family:
          "SF Pro Display",
          "SF Pro",
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        font-size: clamp(48px, 6.8vw, 86px);
        line-height: 1.12;
        letter-spacing: -0.045em;
        font-weight: 600;
        margin: 0;
      }
      .subtitle {
        font-size: 16px;
        color: var(--muted);
        line-height: 1.8;
        margin: 26px 0 36px;
      }
      .book {
        display: inline-flex;
        justify-content: center;
        align-items: center;
        min-height: 46px;
        padding: 0 25px;
        border-radius: 28px;
        background: linear-gradient(#eeeeee, #dedede);
        border: 1px solid #ffffff30;
        box-shadow: 0 2px 12px #00000018;
        color: #171717;
        font-size: 14px;
        font-weight: 500;
        transition:
          transform 0.25s,
          box-shadow 0.25s;
      }
      .book:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 24px #ffffff0d;
      }
      .nav-book:hover {
        background: #f0f0f0;
      }
      .footer {
        position: relative;
        min-height: 35svh;
        text-align: center;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-end;
        padding: 55px 24px 30px;
      }
      .footer p {
        color: #818181;
        font-size: 17px;
        letter-spacing: -0.3px;
        margin: 0 0 65px;
      }
      .footer small {
        color: #737373;
        font-size: 10px;
        letter-spacing: 0.2px;
      }
      @media (max-width: 600px) {
        .header {
          padding: 18px 16px;
        }
        .nav {
          padding: 10px 12px;
        }
        .brand {
          font-size: 17px;
        }
        .hero {
          padding: 120px 24px 100px;
        }
        h1 {
          font-size: clamp(42px, 10.5vw, 58px);
        }
        .subtitle {
          font-size: 13px;
          margin: 24px 0 32px;
        }
        .footer p {
          font-size: 15px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        html {
          scroll-behavior: auto;
        }
        *,
        *::before,
        *::after {
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <a class="skip" href="#main">Skip to content</a>
    <header class="header" id="header">
      <nav class="nav" aria-label="Main navigation">
        <a class="brand" href="#" aria-label="Steve Tutoring home"
          >steve<span> tutoring</span></a
        >
        <a class="nav-book" href="https://calendly.com/stevehan926/1hr" inert
          >Book a session</a
        >
      </nav>
    </header>
    <main id="main">
      <section class="hero" aria-labelledby="hero-title">
        <h1 id="hero-title">Make math click.</h1>
        <p class="subtitle">One-on-one math tutoring. Semiahmoo.</p>
        <a class="book" href="https://calendly.com/stevehan926/1hr"
          >Book a session</a
        >
      </section>
    </main>
    <footer class="footer">
      <p>Your future self will thank you.</p>
      <small>© <span id="year">2026</span> Steve Tutoring</small>
    </footer>
    <script>
      const header = document.getElementById("header");
      const navBook = document.querySelector(".nav-book");
      function updateHeader() {
        const scrolled = window.scrollY > 64;
        header.classList.toggle("scrolled", scrolled);
        navBook.inert = !scrolled;
        if (!scrolled && document.activeElement === navBook)
          document.querySelector(".brand").focus({ preventScroll: true });
      }
      window.addEventListener("scroll", updateHeader, { passive: true });
      updateHeader();
      document.getElementById("year").textContent = new Date().getFullYear();
    </script>
  </body>
</html>
