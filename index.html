<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#12121a" />
    <meta
      name="description"
      content="One-on-one math tutoring with Steve in Semiahmoo. Book a session."
    />
    <title>Steve Tutoring — Make math click.</title>
    <link
      rel="icon"
      href="https://i.postimg.cc/N0rZb872/image.png"
      type="image/png"
    />
    <style>
      :root {
        color-scheme: dark;
        --background: #12121a;
        --text: #eeeeee;
        --muted: #aaa9b8;
      }
      * {
        box-sizing: border-box;
      }
      html {
        scroll-behavior: smooth;
      }
      body {
        margin: 0;
        background: var(--background);
        color: var(--text);
        font-family:
          "SF Pro Text",
          "SF Pro",
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        font-weight: 400;
        -webkit-font-smoothing: antialiased;
      }
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        background:
          radial-gradient(
            ellipse at 25% 32%,
            rgba(79, 111, 195, 0.19),
            transparent 58%
          ),
          radial-gradient(
            ellipse at 77% 61%,
            rgba(129, 91, 177, 0.19),
            transparent 58%
          ),
          radial-gradient(
            ellipse at 50% 45%,
            rgba(213, 220, 255, 0.045),
            transparent 65%
          );
        animation: atmosphere-in 1.8s ease-out both;
      }
      body::after {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        background: linear-gradient(
          135deg,
          #ffffff03,
          #ffffff00 45%,
          #ffffff02
        );
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      a:focus-visible {
        outline: 2px solid #bcbcbc;
        outline-offset: 5px;
      }
      ::selection {
        background: #dddddd;
        color: #111111;
      }
      .skip {
        position: fixed;
        left: 20px;
        top: -100px;
        z-index: 50;
        padding: 12px;
        background: white;
        color: black;
        border-radius: 12px;
      }
      .skip:focus {
        top: 20px;
      }
      .header {
        position: fixed;
        inset: 0 0 auto;
        z-index: 20;
        padding: 25px 24px;
        transition: padding 0.5s cubic-bezier(0.22, 1, 0.36, 1);
      }
      .nav {
        width: max-content;
        margin: 0 0 0 auto;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 8px;
        border: 1px solid transparent;
        border-radius: 18px;
        transition:
          opacity 0.45s,
          background 0.5s,
          border-color 0.5s,
          box-shadow 0.5s;
        opacity: 0;
        pointer-events: none;
      }
      .header.scrolled {
        padding-top: 12px;
        padding-bottom: 12px;
      }
      .header.scrolled .nav {
        opacity: 1;
        pointer-events: auto;
        background: rgba(231, 228, 255, 0.065);
        border-color: rgba(255, 255, 255, 0.14);
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
        box-shadow: 0 10px 40px #00000020;
      }
      .nav-book {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        height: 36px;
        padding: 0 17px;
        border-radius: 24px;
        background: #e4e4e4;
        color: #171717;
        font-size: 12px;
        font-weight: 500;
        opacity: 0;
        transform: translateY(8px);
        pointer-events: none;
        transition:
          opacity 0.35s,
          transform 0.5s cubic-bezier(0.22, 1, 0.36, 1);
      }
      .header.scrolled .nav-book {
        opacity: 1;
        transform: translateY(0);
        pointer-events: auto;
      }
      main {
        position: relative;
      }
      .hero {
        height: 100svh;
        min-height: 420px;
        display: grid;
        grid-template-rows: minmax(0, 1fr) auto minmax(0, 1fr);
        justify-items: center;
        text-align: center;
        padding: 0 24px;
      }
      .hero-copy {
        align-self: end;
        margin-bottom: 54px;
      }
      h1 {
        font-family:
          "SF Pro Display",
          "SF Pro",
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        font-size: clamp(48px, 6.8vw, 86px);
        line-height: 1.18;
        letter-spacing: -0.015em;
        font-weight: 600;
        margin: 0;
        animation: content-in 1.1s cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      .subtitle {
        font-family:
          "SF Pro Display",
          "SF Pro",
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        font-size: 18px;
        letter-spacing: -0.01em;
        color: var(--muted);
        line-height: 1.8;
        margin: 24px 0 0;
        animation: content-in 1.1s 0.14s cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      .book {
        display: inline-flex;
        justify-content: center;
        align-items: center;
        min-height: 46px;
        padding: 0 25px;
        border-radius: 28px;
        background: linear-gradient(135deg, #ffffff18, #ffffff09);
        border: 1px solid #ffffff2e;
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        box-shadow:
          inset 0 1px 0 #ffffff12,
          0 8px 28px #00000018;
        color: #eeeeee;
        font-size: 14px;
        font-weight: 500;
        letter-spacing: -0.01em;
        animation: content-in 1.1s 0.28s cubic-bezier(0.22, 1, 0.36, 1)
          backwards;
        transition:
          transform 0.25s,
          box-shadow 0.25s;
      }
      .book:hover {
        transform: translateY(-2px);
        box-shadow:
          inset 0 1px 0 #ffffff20,
          0 8px 32px #aeb6ff12;
      }
      .nav-book:hover {
        background: #f0f0f0;
      }
      .footer {
        position: relative;
        min-height: 35svh;
        text-align: center;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-end;
        padding: 55px 24px 30px;
      }
      .footer p {
        color: #aaa9b8;
        font-size: 17px;
        letter-spacing: -0.3px;
        margin: 0 0 65px;
      }
      .footer small {
        color: #918f9f;
        font-size: 10px;
        letter-spacing: 0.2px;
      }
      @media (max-width: 600px) {
        .header {
          padding: 18px 16px;
        }
        .hero-copy {
          margin-bottom: 44px;
        }
        h1 {
          font-size: clamp(38px, 10vw, 58px);
        }
        .subtitle {
          font-size: 16px;
          margin: 20px 0 0;
        }
        .footer p {
          font-size: 15px;
        }
      }
      @keyframes content-in {
        from {
          opacity: 0;
          transform: translateY(18px);
          filter: blur(6px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
          filter: blur(0);
        }
      }
      @keyframes atmosphere-in {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        html {
          scroll-behavior: auto;
        }
        *,
        *::before,
        *::after {
          transition: none !important;
          animation: none !important;
        }
      }
    </style>
  </head>
  <body>
    <a class="skip" href="#main">Skip to content</a>
    <header class="header" id="header">
      <nav class="nav" aria-label="Main navigation">
        <a class="nav-book" href="https://calendly.com/stevehan926/1hr" inert
          >Book a session</a
        >
      </nav>
    </header>
    <main id="main">
      <section class="hero" aria-labelledby="hero-title">
        <div class="hero-copy">
          <h1 id="hero-title">Make math click.</h1>
          <p class="subtitle">A little clarity. A lot more confidence.</p>
        </div>
        <a class="book" href="https://calendly.com/stevehan926/1hr"
          >Book a session</a
        >
      </section>
    </main>
    <footer class="footer">
      <p>Your future self will thank you.</p>
      <small>© <span id="year">2026</span> Steve Tutoring</small>
    </footer>
    <script>
      const header = document.getElementById("header");
      const navBook = document.querySelector(".nav-book");
      function updateHeader() {
        const scrolled = window.scrollY > 64;
        header.classList.toggle("scrolled", scrolled);
        navBook.inert = !scrolled;
        if (!scrolled && document.activeElement === navBook)
          document.querySelector(".book").focus({ preventScroll: true });
      }
      window.addEventListener("scroll", updateHeader, { passive: true });
      updateHeader();
      document.getElementById("year").textContent = new Date().getFullYear();
    </script>
  </body>
</html>
