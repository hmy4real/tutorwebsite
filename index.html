<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#12121a" />
    <meta
      name="description"
      content="One-on-one math tutoring with Steve in Semiahmoo. Book a session."
    />
    <title>Steve Tutoring</title>
    <link
      rel="icon"
      href="https://i.postimg.cc/N0rZb872/image.png"
      type="image/png"
    />
    <style>
      :root {
        color-scheme: dark;
        --background: #12121a;
        --text: #eeeeee;
        --muted: #aaa9b8;
      }
      * {
        box-sizing: border-box;
      }
      html {
        scroll-behavior: smooth;
      }
      body {
        margin: 0;
        background: var(--background);
        color: var(--text);
        font-family:
          "SF Pro Text",
          "SF Pro",
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        font-weight: 400;
        -webkit-font-smoothing: antialiased;
      }
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        background:
          radial-gradient(
            ellipse at 25% 32%,
            rgba(79, 111, 195, 0.19),
            transparent 58%
          ),
          radial-gradient(
            ellipse at 77% 61%,
            rgba(129, 91, 177, 0.19),
            transparent 58%
          ),
          radial-gradient(
            ellipse at 50% 45%,
            rgba(213, 220, 255, 0.045),
            transparent 65%
          );
        animation: atmosphere-in 1.8s ease-out both;
      }
      body::after {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        background: linear-gradient(
          135deg,
          #ffffff03,
          #ffffff00 45%,
          #ffffff02
        );
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      a:focus-visible {
        outline: 2px solid #bcbcbc;
        outline-offset: 5px;
      }
      ::selection {
        background: #dddddd;
        color: #111111;
      }
      .skip {
        position: fixed;
        left: 20px;
        top: -100px;
        z-index: 50;
        padding: 12px;
        background: white;
        color: black;
        border-radius: 12px;
      }
      .skip:focus {
        top: 20px;
      }
      main {
        position: relative;
      }
      .hero {
        min-height: 100svh;
        display: grid;
        grid-template-rows: 1fr auto 1fr;
        justify-items: center;
        text-align: center;
        padding: 28px 24px;
      }
      .hero-copy {
        align-self: end;
        margin-bottom: 54px;
      }
      h1 {
        font-family:
          "SF Pro Display",
          "SF Pro",
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        font-size: clamp(48px, 6.8vw, 86px);
        line-height: 1.2;
        font-weight: 600;
        margin: 0;
        animation: content-in 1.1s cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      .subtitle {
        max-width: 660px;
        font-family:
          "SF Pro Display",
          "SF Pro",
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        font-size: 22px;
        color: var(--muted);
        line-height: 1.6;
        margin: 24px auto 0;
        animation: content-in 1.1s 0.14s cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      .glass-link {
        display: inline-flex;
        justify-content: center;
        align-items: center;
        min-height: 46px;
        padding: 0 25px;
        border-radius: 28px;
        background: linear-gradient(135deg, #ffffff18, #ffffff09);
        border: 1px solid #ffffff2e;
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        box-shadow:
          inset 0 1px 0 #ffffff12,
          0 8px 28px #00000018;
        color: #eeeeee;
        font-weight: 500;
        transition:
          transform 0.25s,
          box-shadow 0.25s;
      }
      .book {
        font-size: 16px;
        animation: content-in 1.1s 0.28s cubic-bezier(0.22, 1, 0.36, 1)
          backwards;
      }
      .glass-link:hover {
        transform: translateY(-2px);
        box-shadow:
          inset 0 1px 0 #ffffff20,
          0 8px 32px #aeb6ff12;
      }
      .tools {
        margin-top: calc(-1 * min(22svh, 210px));
        padding: 28px 24px 0;
        text-align: center;
      }
      .tools h2 {
        margin: 0 0 16px;
        color: var(--muted);
        font-size: 19px;
        font-weight: 500;
      }
      .tool-links {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
      }
      .tool-link {
        padding-inline: 20px;
        background: #ffffff07;
        border-color: #ffffff23;
        font-size: 14px;
      }
      .footer {
        position: relative;
        min-height: 35svh;
        text-align: center;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-end;
        padding: 55px 24px 30px;
      }
      .footer p {
        color: #aaa9b8;
        font-size: 17px;
        letter-spacing: -0.3px;
        margin: 0 0 65px;
      }
      .footer small {
        color: #918f9f;
        font-size: 10px;
        letter-spacing: 0.2px;
      }
      @media (max-width: 600px) {
        .hero-copy {
          margin-bottom: 44px;
        }
        h1 {
          font-size: clamp(38px, 10vw, 58px);
        }
        .subtitle {
          font-size: 16px;
          margin: 20px auto 0;
        }
        .footer p {
          font-size: 15px;
        }
      }
      @media (max-height: 560px) {
        .tools {
          margin-top: -40px;
        }
      }
      @keyframes content-in {
        from {
          opacity: 0;
          transform: translateY(18px);
          filter: blur(6px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
          filter: blur(0);
        }
      }
      @keyframes atmosphere-in {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        html {
          scroll-behavior: auto;
        }
        *,
        *::before,
        *::after {
          transition: none !important;
          animation: none !important;
        }
      }
    </style>
  </head>
  <body>
    <a class="skip" href="#main">Skip to content</a>
    <main id="main">
      <section class="hero" aria-labelledby="hero-title">
        <div class="hero-copy">
          <h1 id="hero-title">Make math click.</h1>
          <p class="subtitle">
            One-on-one math tutoring with Steve, turning tricky concepts into
            clear understanding and lasting confidence.
          </p>
        </div>
        <a class="glass-link book" href="https://calendly.com/stevehan926/1hr"
          >Book a session</a
        >
      </section>
      <section class="tools" aria-labelledby="tools-title">
        <h2 id="tools-title">Useful Tools</h2>
        <div class="tool-links">
          <a class="glass-link tool-link" href="/ai">SteveGPT</a>
          <a class="glass-link tool-link" href="/clock">Live Time</a>
        </div>
      </section>
    </main>
    <footer class="footer">
      <p>Your future self will thank you.</p>
      <small>© <span id="year">2026</span> Steve Tutoring</small>
    </footer>
    <script>
      document.getElementById("year").textContent = new Date().getFullYear();
    </script>
  </body>
</html>
